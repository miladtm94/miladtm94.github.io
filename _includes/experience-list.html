<style>
  .experience-list {
    display: flex;
    flex-direction: column;
    gap: 1.2em;
    margin: 1em 0 2em;
  }

  .experience-details {
    padding: 1em 1.2em;
    border: 1px solid var(--global-border-color);
    border-left: 4px solid var(--accent);
    border-radius: 14px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  .experience-details summary {
    list-style: none;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 0.4em;
    margin: 0;
    padding: 0;
    cursor: pointer;
  }

  .experience-details summary::-webkit-details-marker,
  .experience-details summary::marker {
    display: none;
  }

  .experience-details .summary-title {
    min-width: 0;
  }

  .experience-details summary > span {
    white-space: nowrap;
  }

  .experience-details .experience-organization {
    font-size: 0.9em;
    color: var(--global-text-color-light);
  }

  .experience-details .experience-date {
    font-size: 0.85em;
    color: var(--global-text-color-light);
    white-space: nowrap;
  }

  .experience-details .toggle-icon {
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: var(--surface-tint);
    color: var(--accent);
    font-size: 0.95em;
    transition: transform 0.2s ease;
  }

  .experience-details[open] .toggle-icon {
    transform: rotate(180deg);
  }

  .experience-details ul {
    margin: 0.9em 0 0;
    padding-left: 1.2em;
    font-size: 0.9em;
    opacity: 0.85;
    line-height: 1.65;
  }

  @media (max-width: 640px) {
    .experience-details summary {
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: flex-start;
    }

    .experience-details .experience-date {
      grid-column: 1 / -1;
      grid-row: 2;
      white-space: normal;
    }

    .experience-details .toggle-icon {
      grid-column: 2;
      grid-row: 1;
    }
  }
</style>

<div class="experience-list">
  {% for item in include.items %}
    {% include experience-card.html item=item %}
  {% endfor %}
</div>
