  - title: "ARC Postdoctoral Research Fellow —  Secure Machine‑Type Communications"
    type: "Full-time"
    organization: "The Australian National University"
    location: "Canberra, Australia"
    date: "Jan 2023 &ndash; Jan 2025"
    highlights:
      - "Researched on machine-type communications, physical-layer security, and integrated radar sensing and communications."
      - "Proposed novel information‑theoretic performance metrics for information leakage in finite‑blocklength wiretap fading channels."
      - "Designed joint resource allocation and 3D UAV‑trajectory algorithms for secure short‑packet aerial relaying systems under propulsion limits."
      - "Formulated a game model for ISAC under mobile eavesdropping and developed DRL agents for adaptive trajectory and beamforming control."
      - "Published 3 first‑author Q1 IEEE journal articles (1x JSAC, 2x TWC) and 2 conference papers (IEEE ICC 2024, IEEE GLOBECOM 2023)."
      - "Received 2 IEEE best‑paper awards (IEEE SPCC‑TC BPA 2024; IEEE ICC BPA 2024 — top 0.6% of 2,364 submissions)."

  - title: "Doctoral Researcher — Wireless UAV Communications"
    type: "Full-time"
    organization: "Monash University"
    location: "Melbourne, Australia"
    date: "Jan 2019 &ndash; Dec 2022"
    highlights:
      - "Designed reinforcement learning and mathematical optimisation frameworks for energy‑efficient, secure airborne communications."
      - "Formulated and solved problems on aerial beamforming, spatial jamming, and trajectory planning to secure UAV network architectures."
      - "Proposed learning‑based system designs for secure MIMO‑UAV relaying, achieving significant performance improvements over baselines."
      - "Developed reproducible MATLAB/Python simulations to validate analytical secrecy and reliability models under practical constraints."
      - "Published 7 peer-reviewed articles in leading IEEE journals; received 5+ awards, grants, and accolades for research excellence."

